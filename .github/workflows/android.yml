name: Android app

# Builds the APK on every change to android/ and publishes it as the
# "android-latest" release, so it can be downloaded straight to a phone:
# https://github.com/<owner>/<repo>/releases/latest/download/ShortFormBlocker.apk
#
# Signing: Android only installs an update over an app signed with the same
# key. The first build creates a signing key and keeps it in the Actions cache
# (not in the repo), so every later build uses the same one. The weekly
# "keep-key" job stops the cache from expiring. The password only protects the
# file inside that cache.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ~/signing
          key: android-signing-key-v1

      - name: Create signing key (first build only)
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/signing
          keytool -genkeypair -keystore ~/signing/release.keystore -storetype PKCS12 \
            -alias shortformblocker -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" \
            -dname "CN=Short-Form Blocker"
        env:
          SIGNING_PASSWORD: shortformblocker

      - name: Build APK
        run: SIGNING_KEYSTORE="$HOME/signing/release.keystore" ./gradlew --no-daemon assembleRelease
        env:
          SIGNING_PASSWORD: shortformblocker

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ShortFormBlocker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShortFormBlocker-apk
          path: android/ShortFormBlocker.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest ShortFormBlocker.apk \
            --target "$GITHUB_SHA" \
            --title "Android app (latest build)" \
            --latest \
            --notes "Latest build of the Short-Form Blocker Android app from commit ${GITHUB_SHA::7}.

          **Install:** open this page on your Android phone, tap **ShortFormBlocker.apk**, and allow your browser to install apps when asked. Then open the app and follow the steps on screen. See the README for details."

  keep-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Touch the cached signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/signing
          key: android-signing-key-v1
