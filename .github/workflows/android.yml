name: Android app

# Builds the APK on every change to android/ and publishes it as the
# "android-latest" release, so it can be downloaded straight to a phone:
# https://github.com/<owner>/<repo>/releases/latest/download/ShortFormBlocker.apk
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ShortFormBlocker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShortFormBlocker-apk
          path: android/ShortFormBlocker.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest ShortFormBlocker.apk \
            --target "$GITHUB_SHA" \
            --title "Android app (latest build)" \
            --latest \
            --notes "Latest build of the Short-Form Blocker Android app from commit ${GITHUB_SHA::7}.

          **Install:** open this page on your Android phone, tap **ShortFormBlocker.apk**, and allow your browser to install apps when asked. Then open the app and follow the steps on screen. See the README for details."
