<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Short-Form Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon48.png" alt="" width="32" height="32" />
      <div class="title">
        <h1>Short-Form Blocker</h1>
        <p id="status">Blocking Shorts and Reels</p>
      </div>
      <label class="switch" title="Turn Short-Form Blocker on or off">
        <input type="checkbox" data-key="enabled" aria-label="Enable Short-Form Blocker" />
        <span class="track"></span>
      </label>
    </header>

    <main>
      <section>
        <h2>YouTube</h2>
        <label class="row">
          <span class="text">
            <strong>Hide Shorts</strong>
            <small>Feeds, search, sidebar and channel tabs</small>
          </span>
          <span class="switch">
            <input type="checkbox" data-key="hideShorts" />
            <span class="track"></span>
          </span>
        </label>
        <label class="row">
          <span class="text"><strong>Shorts links</strong></span>
          <select data-key="shortsRedirect">
            <option value="watch">Play in normal player</option>
            <option value="home">Go to homepage</option>
            <option value="off">Leave alone</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Instagram</h2>
        <label class="row">
          <span class="text">
            <strong>Hide Reels</strong>
            <small>Reels tab, feed, Explore and profile tabs</small>
          </span>
          <span class="switch">
            <input type="checkbox" data-key="hideReels" />
            <span class="track"></span>
          </span>
        </label>
        <label class="row">
          <span class="text"><strong>Reels links</strong></span>
          <select data-key="reelsRedirect">
            <option value="single">Show just that reel</option>
            <option value="home">Go to homepage</option>
            <option value="off">Leave alone</option>
          </select>
        </label>
      </section>
    </main>

    <script src="defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
